name: Publish symbols Gradle plugin

# Releases the `app.replayfy.symbols` Gradle plugin
# (app.replayfy:symbols-gradle-plugin + its plugin marker) to Maven Central via
# the Central Portal, with auto-release. Separate from the SDK release
# (publish-maven-central.yml, tags v*) so the two version independently.
# Trigger: push a tag `symbols-v<version>` (e.g. symbols-v0.1.0), or run manually.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to publish (e.g. 0.1.0), no prefix"
        required: true
  push:
    tags: ["symbols-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#symbols-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish + auto-release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # --no-configuration-cache: same vanniktech/Gradle 8.10.2 limitation as
          # the SDK publish (see publish-maven-central.yml).
          ./gradlew :sdk-symbols-plugin:publishAndReleaseToMavenCentral \
            -PsymbolsPluginVersion=${{ steps.v.outputs.version }} \
            --no-configuration-cache --no-daemon --stacktrace
